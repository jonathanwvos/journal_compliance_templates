[project]
name = "journal-compliance-templates"
version = "0.1.0"
description = "Machine-readable and human-auditable formatting and compliance templates for major scientific journals"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.1",
    "jsonschema>=4.21.0",
    "jinja2>=3.1.3",
    "python-docx>=1.1.0",
]

[project.scripts]
jct = "journal_compliance_templates.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "matplotlib>=3.8.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/journal_compliance_templates"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src", "."]
markers = [
    "gui: Browser GUI and end-to-end user tests using Playwright",
]

[dependency-groups]
dev = [
    "pytest-playwright>=0.9.0",
]
