# ==============================================================================
# Cell Press (Elsevier): Journal Compliance Template
# Official Cell guidelines: https://www.cell.com/cell/authors
# ==============================================================================

schema_version: "1.1.0"

metadata:
  publisher: "Cell Press (Elsevier)"
  journal_name: "Cell"
  issn: "0092-8674"
  guidelines_url: "https://www.cell.com/cell/authors"
  last_verified: "2026-09-11"
  notes: >
    Official guidelines for Cell Press primary research manuscripts.
    Features STAR Methods framework, Key Resources Table, 85 mm single column width,
    mandatory standalone AI declaration section, and strict accessibility requirements.

# ------------------------------------------------------------------------------
# Figure Dimensions & Geometry
# Source: Cell Press Figure Guidelines
# "Single column width: 85 mm (3.35 in / 20 picas)."
# "1.5 column width: 114 mm (4.49 in / 27 picas)."
# "Double column width: 174 mm (6.85 in / 41 picas)."
# "Maximum depth: 235 mm."
# ------------------------------------------------------------------------------
figure_geometry:
  default_unit: "mm"
  max_height: 235.0
  column_widths:
    single_column:
      width: 85.0
      description: "Standard 1-column width (85 mm / 3.35 in)"
    one_and_half_column:
      width: 114.0
      description: "Intermediate 1.5-column width (114 mm / 4.49 in)"
    double_column:
      width: 174.0
      description: "Full text-width 2-column page spread (174 mm / 6.85 in)"
  panel_spacing:
    minimum_gutter: 3.0

# ------------------------------------------------------------------------------
# Typography Hierarchy for Figures
# Source: Cell Press Guidelines - Arial or Helvetica preferred
# "Text size: 6-8 pt; panel titles: 8 pt bold. No text under 5 pt is permitted."
# ------------------------------------------------------------------------------
figure_typography:
  family_preferences:
    primary: "Arial"
    fallback:
      - "Helvetica"
    serif_alternative: "Times New Roman"
    symbol_font: "Symbol"
  font_sizes:
    unit: "pt"
    panel_label:
      size: 8.0
      weight: "bold"
    axis_title:
      size: 7.0
      weight: "regular"
    tick_label:
      size: 6.0
      weight: "regular"
    legend_title:
      size: 6.5
      weight: "bold"
    legend_text:
      size: 6.0
      weight: "regular"
    annotation:
      size: 5.5
      weight: "regular"
    min_allowed_size: 5.0  # Cell rejection floor

# ------------------------------------------------------------------------------
# Line Weights & Stroke Thickness
# Source: Cell Press Artwork Guidelines - Minimum line thickness 0.25 pt (0.5 pt preferred)
# ------------------------------------------------------------------------------
line_weights:
  unit: "pt"
  axis_lines: 0.5
  tick_marks: 0.5
  data_lines_normal: 1.0
  data_lines_thick: 1.5
  grid_lines: 0.25
  min_allowed_weight: 0.25

# ------------------------------------------------------------------------------
# Panel Labeling Convention
# Source: Cell Press Guidelines - "Capital bold letters (A, B, C) placed top-left."
# ------------------------------------------------------------------------------
panel_labeling:
  case: "uppercase"
  weight: "bold"
  punctuation: ""
  position: "top_left_outside"
  font_family: "Arial"

# ------------------------------------------------------------------------------
# Color & Accessibility Requirements
# Source: Cell Press Accessibility Guidelines - Accessible to CVD readers
# ------------------------------------------------------------------------------
color_specifications:
  accepted_modes:
    initial_submission:
      - "RGB"
    final_production:
      - "RGB"
      - "CMYK"
  color_blind_safe_required: true
  recommended_palettes:
    - "Okabe-Ito"
    - "Tol-Bright"
    - "Viridis"
  black_white_contrast_ratio: 4.5

# ------------------------------------------------------------------------------
# Export Formats & Resolution (DPI)
# ------------------------------------------------------------------------------
export_requirements:
  preferred_vector_formats:
    - format: "PDF"
      notes: "Vector PDF with all fonts embedded."
    - format: "EPS"
      notes: "Encapsulated PostScript with fonts converted to outlines."
  accepted_raster_formats:
    - format: "TIFF"
      compression: "LZW"
  resolution_dpi:
    line_art: 1000
    combination_art: 500
    photographic_halftone: 300
  max_file_size_mb: 50

# ------------------------------------------------------------------------------
# Manuscript Text Formatting
# Source: Cell Press STAR Methods & Manuscript Structure
# ------------------------------------------------------------------------------
manuscript_layout:
  page:
    size: "Letter"
    margins_mm:
      top: 25.4
      bottom: 25.4
      left: 25.4
      right: 25.4
  spacing:
    line_spacing: "double"
    line_numbering: "continuous"
  body_typography:
    font_family: "Arial"
    font_size_pt: 11.0
  heading_hierarchy:
    title:
      size_pt: 18.0
      weight: "bold"
      numbered: false
    h1:
      size_pt: 12.0
      weight: "bold"
      numbered: false
    h2:
      size_pt: 11.0
      weight: "bold"
      numbered: false
    h3:
      size_pt: 11.0
      weight: "italic"
      numbered: false
  limits:
    abstract_max_words: 150
    main_text_max_words: 7000
    max_display_items: 7  # Standard Cell limit of 7 display items
  required_sections:
    - "Title, Authors, Affiliations"
    - "Summary (Abstract)"
    - "Introduction"
    - "Results"
    - "Discussion"
    - "Declaration of Generative AI and AI-Assisted Technologies in the Writing Process"
    - "STAR Methods"
    - "Key Resources Table"
    - "Resource Availability (Lead Contact, Materials Availability, Data and Code Availability)"
    - "Experimental Model and Study Participant Details"
    - "Method Details"
    - "Quantification and Statistical Analysis"
    - "Acknowledgments"
    - "Author Contributions"
    - "Declaration of Interests"
    - "References"

# ------------------------------------------------------------------------------
# AI & Generative Technologies Policy
# Source: Elsevier Policy on the Use of Generative AI in Scientific Writing
# "Authors must disclose the use of generative AI in a dedicated standalone section.
# AI technologies cannot be listed as an author or co-author."
# ------------------------------------------------------------------------------
ai_policy:
  authorship_eligible: false
  generative_imagery_allowed: false
  generative_imagery_exceptions: >
    Permissible only when generative AI models are the direct subject of scientific analysis.
  text_and_code_disclosure_required: true
  preferred_disclosure_placement: "Declaration of Generative AI and AI-assisted technologies in the writing process"
  policy_url: "https://www.elsevier.com/about/policies-and-standards/the-use-of-generative-ai-and-ai-assisted-technologies-in-writing-for-elsevier"
  official_statement_template: >
    Declaration of generative AI and AI-assisted technologies in the writing process:
    During the preparation of this work the author(s) used [NAME TOOL / SERVICE] in order to [REASON].
    After using this tool/service, the author(s) reviewed and edited the content as needed and
    take(s) full responsibility for the content of the publication.

# ------------------------------------------------------------------------------
# Naming conventions: requirements, project recommendations, and unverified guidance
# Each rule carries its own evidence status; examples are illustrative.
# ------------------------------------------------------------------------------
naming_conventions:
  figures:
  - id: figure_numbering
    guidance: Number main figures independently of tables, starting at 1 in first-citation order.
    status: unverified
    source_url: https://www.cell.com/cell/authors
    source_section: 'Figure numbering: confirm current journal instructions'
    pattern: Figure {number}
    numbering:
      style: arabic
      start: 1
      order: first_citation
      sequence: main_figures
    examples:
    - Figure 1
    - Figure 2
    - Figure 3
  - id: figure_references
    guidance: Provisional reference examples; confirm abbreviation, pluralization, and range style in
      current journal instructions.
    status: unverified
    examples:
    - Figure 1
    - Figures 1 and 3
    - Figures 1–3
    source_url: https://www.cell.com/cell/authors
  - id: panel_references
    guidance: Use panel_labeling for letter case and punctuation. Panels share their parent figure number;
      these reference examples follow the existing panel labels.
    status: project_recommendation
    examples:
    - Figure 1A
    - Figure 1A and 1C
    - Figure 1A–C
  captions:
  - id: caption_heading
    guidance: Match each caption to its figure number and begin with a concise title. Punctuation in these
      examples is a project convention unless separately verified.
    status: project_recommendation
    pattern: Figure {number}. {title}
    examples:
    - Figure 1. Study design.
    - Figure 2. Measured response.
    - Figure 3. Validation results.
  - id: caption_panels
    guidance: Describe all panels in label order under one figure caption. Reuse the exact panel letters;
      do not number captions separately.
    status: project_recommendation
    examples:
    - Figure 1. Study design. A Recruitment. B Sampling. C Analysis.
  - id: caption_placement
    guidance: Confirm whether captions belong beside figures, at the end of the manuscript, or in a separate
      document for the submission stage.
    status: unverified
    source_url: https://www.cell.com/cell/authors
    examples:
    - Keep captions in figure-number order wherever the journal requests them.
  tables:
  - id: table_numbering
    guidance: Number tables independently of figures, starting at 1 in first-citation order.
    status: unverified
    source_url: https://www.cell.com/cell/authors
    source_section: 'Table numbering: confirm current journal instructions'
    pattern: Table {number}
    numbering:
      style: arabic
      start: 1
      order: first_citation
      sequence: main_tables
    examples:
    - Table 1
    - Table 2
    - Table 3
  - id: table_title
    guidance: Give each table a short descriptive title after its number; confirm placement for the submission
      stage.
    status: project_recommendation
    pattern: Table {number}. {title}
    examples:
    - Table 1. Participant characteristics.
    - Table 2. Model parameters.
    - Table 3. Validation metrics.
  - id: table_references
    guidance: Use the table sequence in text references. These grouped and range examples are project
      recommendations.
    status: project_recommendation
    examples:
    - Table 1
    - Tables 1 and 3
    - Tables 1–3
  supplementary:
  - id: supplementary_figure_numbering
    guidance: Use a separate sequence for this supplementary item type. These labels are provisional;
      confirm the journal’s current supporting-information or appendix convention.
    status: unverified
    source_url: https://www.cell.com/cell/authors
    pattern: Figure S{number}
    numbering:
      style: arabic
      start: 1
      order: first_citation
      sequence: supplementary_figures
    examples:
    - Figure S1
    - Figure S2
    - Figure S3
  - id: supplementary_table_numbering
    guidance: Use a separate sequence for this supplementary item type. These labels are provisional;
      confirm the journal’s current supporting-information or appendix convention.
    status: unverified
    source_url: https://www.cell.com/cell/authors
    pattern: Table S{number}
    numbering:
      style: arabic
      start: 1
      order: first_citation
      sequence: supplementary_tables
    examples:
    - Table S1
    - Table S2
    - Table S3
  - id: supplementary_captions
    guidance: Match supplementary captions and table titles to their supplementary identifiers, keeping
      them separate from main-item sequences.
    status: project_recommendation
    examples:
    - Figure S1. Additional measurements.
    - Table S1. Additional model parameters.
  filenames:
  - id: figure_filenames
    guidance: Project filename recommendation for separate files only. Replace {ext} with an accepted
      format for this item and submission stage; this does not require a separate upload.
    status: project_recommendation
    pattern: figure_{number:02d}.{ext}
    examples:
    - figure_01.{ext}
    - figure_02.{ext}
    - figure_03.{ext}
  - id: table_filenames
    guidance: Project filename recommendation for separate files only. Replace {ext} with an accepted
      format for this item and submission stage; this does not require a separate upload.
    status: project_recommendation
    pattern: table_{number:02d}.{ext}
    examples:
    - table_01.{ext}
    - table_02.{ext}
    - table_03.{ext}
  - id: caption_filenames
    guidance: If caption documents are requested, use one combined document or matching figure stems for
      individual documents. DOCX examples apply only when the journal accepts DOCX.
    status: project_recommendation
    examples:
    - figure_captions.docx
    - figure_01_caption.docx
    - figure_02_caption.docx
    - figure_03_caption.docx
  - id: supplementary_filenames
    guidance: Prefix separate supplementary files to prevent collisions with main items. Use an accepted
      extension; keep the same numeric identifier as the supplementary label.
    status: project_recommendation
    examples:
    - supplementary_figure_01.{ext}
    - supplementary_figure_02.{ext}
    - supplementary_table_01.{ext}
    - supplementary_figure_01_caption.docx
  - id: filename_priority
    guidance: Publisher and submission-portal instructions override these project filenames. Zero-padding
      is at least two digits and does not truncate larger numbers.
    status: project_recommendation
    examples:
    - figure_10.{ext}
    - figure_100.{ext}
