# ==============================================================================
# IEEE Transactions: Journal Compliance Template
# Official IEEE guidelines: https://journals.ieeeauthorcenter.ieee.org/create-your-ieee-journal-article/create-graphics-for-your-article/
# ==============================================================================

schema_version: "1.0.0"

metadata:
  publisher: "IEEE (Institute of Electrical and Electronics Engineers)"
  journal_name: "IEEE Transactions"
  issn: "0162-8828"
  guidelines_url: "https://journals.ieeeauthorcenter.ieee.org/create-your-ieee-journal-article/create-graphics-for-your-article/"
  last_verified: "2026-09-11"
  notes: >
    Official guidelines for IEEE Transactions, Journals, and Letters.
    Features standard 2-column layout with 3.5 in (88.9 mm) single column width,
    Times New Roman font hierarchy, strict 0.5 pt minimum line weight, and 6 pt font rejection floor.

# ------------------------------------------------------------------------------
# Figure Dimensions & Geometry
# Source: IEEE Author Center - Sizing of Graphics
# "Single column width: 3.5 inches (88.9 mm / 21 picas)."
# "Double column width: 7.16 inches (181.9 mm / 43 picas)."
# "Maximum depth / height: 9.5 inches (241.3 mm / 57 picas)."
# ------------------------------------------------------------------------------
figure_geometry:
  default_unit: "mm"
  max_height: 241.3  # Max page depth
  column_widths:
    single_column:
      width: 88.9
      description: "Standard single column width (3.5 in / 88.9 mm / 21 picas)"
    double_column:
      width: 181.9
      description: "Full-width double column spread (7.16 in / 181.9 mm / 43 picas)"
  panel_spacing:
    minimum_gutter: 3.0

# ------------------------------------------------------------------------------
# Typography Hierarchy for Figures
# Source: IEEE Guidelines - "Use Times New Roman or Helvetica fonts for figure lettering."
# "Font sizes should be 8-10 pt. Letters must not be smaller than 6 pt at final printed size."
# ------------------------------------------------------------------------------
figure_typography:
  family_preferences:
    primary: "Times New Roman"
    fallback:
      - "Helvetica"
      - "Arial"
      - "Nimbus Roman"
    serif_alternative: "Times New Roman"
    symbol_font: "Symbol"
  font_sizes:
    unit: "pt"
    panel_label:
      size: 8.0
      weight: "bold"
    axis_title:
      size: 8.0
      weight: "regular"
    tick_label:
      size: 7.0
      weight: "regular"
    legend_title:
      size: 7.5
      weight: "bold"
    legend_text:
      size: 7.0
      weight: "regular"
    annotation:
      size: 6.5
      weight: "regular"
    min_allowed_size: 6.0  # IEEE production rejection floor

# ------------------------------------------------------------------------------
# Line Weights & Stroke Thickness
# Source: IEEE Guidelines - "Do not use line weights lighter than 0.5 point (0.18 mm)."
# ------------------------------------------------------------------------------
line_weights:
  unit: "pt"
  axis_lines: 0.5
  tick_marks: 0.5
  data_lines_normal: 1.0
  data_lines_thick: 1.5
  grid_lines: 0.25
  min_allowed_weight: 0.5  # Strict IEEE production floor

# ------------------------------------------------------------------------------
# Panel Labeling Convention
# Source: IEEE Style Guide - "(a) Sub-figure caption. (b) Sub-figure caption."
# ------------------------------------------------------------------------------
panel_labeling:
  case: "lowercase"
  weight: "bold"
  punctuation: "(a)"
  position: "top_left"
  font_family: "Times New Roman"

# ------------------------------------------------------------------------------
# Color & Accessibility Requirements
# Source: IEEE - "Figures must be clearly interpretable in grayscale or by color-blind readers."
# ------------------------------------------------------------------------------
color_specifications:
  accepted_modes:
    initial_submission:
      - "RGB"
    final_production:
      - "RGB"
      - "CMYK"
  color_blind_safe_required: true
  recommended_palettes:
    - "Okabe-Ito"
    - "Tol-Bright"
    - "Viridis"
  black_white_contrast_ratio: 4.5

# ------------------------------------------------------------------------------
# Export Formats & Resolution (DPI)
# Source: IEEE Graphics Checker - EPS and PDF preferred; TIFF for raster.
# ------------------------------------------------------------------------------
export_requirements:
  preferred_vector_formats:
    - format: "EPS"
      notes: "Encapsulated PostScript with fonts embedded or converted to curves."
    - format: "PDF"
      notes: "Vector PDF with high-resolution subset fonts embedded."
  accepted_raster_formats:
    - format: "TIFF"
      compression: "LZW"
  resolution_dpi:
    line_art: 1000
    combination_art: 600
    photographic_halftone: 300
  max_file_size_mb: 50

# ------------------------------------------------------------------------------
# Manuscript Text Formatting
# Source: IEEE Article Templates (IEEEtran) - Two-column US Letter format
# ------------------------------------------------------------------------------
manuscript_layout:
  page:
    size: "Letter"
    margins_mm:
      top: 19.1     # 0.75 in
      bottom: 25.4  # 1.0 in
      left: 16.5    # 0.65 in
      right: 16.5   # 0.65 in
  spacing:
    line_spacing: "single"
    line_numbering: "none"
  body_typography:
    font_family: "Times New Roman"
    font_size_pt: 10.0
  heading_hierarchy:
    title:
      size_pt: 24.0
      weight: "bold"
      numbered: false
    h1:
      size_pt: 10.0
      weight: "bold"
      numbered: true
    h2:
      size_pt: 10.0
      weight: "italic"
      numbered: true
    h3:
      size_pt: 10.0
      weight: "italic"
      numbered: true
  limits:
    abstract_max_words: 250
    main_text_max_words: 9000
    max_display_items: 12
  required_sections:
    - "Title, Authors, Affiliations"
    - "Abstract"
    - "Index Terms (Keywords)"
    - "Introduction"
    - "Related Work / System Model"
    - "Methodology / Proposed Formulation"
    - "Experimental Evaluation / Results"
    - "Conclusion"
    - "Acknowledgment"
    - "References"
    - "Biographies with Author Photographs"

# ------------------------------------------------------------------------------
# AI & Generative Technologies Policy
# Source: IEEE Principles for AI-Generated Text & Media
# "The use of artificial intelligence (AI)–generated text in an article shall not be
# listed as an author. The use of generative AI tools must be disclosed in the Acknowledgment."
# ------------------------------------------------------------------------------
ai_policy:
  authorship_eligible: false
  generative_imagery_allowed: false
  generative_imagery_exceptions: >
    Permissible only when generative AI models are the direct subject of scientific analysis.
  text_and_code_disclosure_required: true
  preferred_disclosure_placement: "Acknowledgment"
  policy_url: "https://journals.ieeeauthorcenter.ieee.org/become-an-ieee-journal-author/publishing-ethics/guidelines-and-policies/ieee-principles-for-artificial-intelligence-ai-generated-text/"
  official_statement_template: >
    The author(s) acknowledge the use of [TOOL NAME, VERSION, e.g., ChatGPT-4 / Claude 3.5]
    to assist in [SPECIFY PURPOSE: e.g., editing and improving English prose clarity / formatting references].
    The author(s) have reviewed all content and take full responsibility for the accuracy,
    originality, and integrity of the entire manuscript.
