[package]
name = "journal-compliance-templates"
version = "0.1.0"
edition = "2021"
authors = ["Jonathan W. Vos"]
description = "Machine-readable formatting and compliance templates for scientific publishing in Rust"
license = "MIT"
repository = "https://github.com/jonathanwvos/journal_compliance_templates"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
plotters = { version = "0.3", default-features = false, features = ["svg_backend", "bitmap_backend", "line_series", "area_series"] }

[dev-dependencies]
tempfile = "3"
