# ==============================================================================
# IEEE Transactions: Journal Compliance Template
# Official IEEE guidelines: https://journals.ieeeauthorcenter.ieee.org/create-your-ieee-journal-article/create-graphics-for-your-article/
# ==============================================================================

schema_version: "1.1.0"

metadata:
  publisher: "IEEE (Institute of Electrical and Electronics Engineers)"
  journal_name: "IEEE Transactions"
  issn: "0162-8828"
  guidelines_url: "https://journals.ieeeauthorcenter.ieee.org/create-your-ieee-journal-article/create-graphics-for-your-article/"
  last_verified: "2026-09-11"
  notes: >
    Official guidelines for IEEE Transactions, Journals, and Letters.
    Features standard 2-column layout with 3.5 in (88.9 mm) single column width,
    Times New Roman font hierarchy, strict 0.5 pt minimum line weight, and 6 pt font rejection floor.

# ------------------------------------------------------------------------------
# Figure Dimensions & Geometry
# Source: IEEE Author Center - Sizing of Graphics
# "Single column width: 3.5 inches (88.9 mm / 21 picas)."
# "Double column width: 7.16 inches (182.0 mm / 43 picas)."
# "Maximum depth / height: 8.8 inches (220.0 mm / 57 picas)."
# ------------------------------------------------------------------------------
figure_geometry:
  default_unit: "mm"
  max_height: 220.0  # Current Author Center file-formatting maximum
  column_widths:
    single_column:
      width: 88.9
      description: "Standard single column width (3.5 in / 88.9 mm / 21 picas)"
    double_column:
      width: 182.0
      description: "Full-width double column spread (7.16 in / 182.0 mm / 43 picas)"
  panel_spacing:
    minimum_gutter: 3.0

# ------------------------------------------------------------------------------
# Typography Hierarchy for Figures
# Source: IEEE Guidelines - "Use Times New Roman or Helvetica fonts for figure lettering."
# Current File Formatting guidance recommends approximately 9–10 pt at full size.
# https://journals.ieeeauthorcenter.ieee.org/create-your-ieee-journal-article/create-graphics-for-your-article/file-formatting/
# ------------------------------------------------------------------------------
figure_typography:
  family_preferences:
    primary: "Times New Roman"
    fallback:
      - "Helvetica"
      - "Arial"
      - "Nimbus Roman"
    serif_alternative: "Times New Roman"
    symbol_font: "Symbol"
  font_sizes:
    unit: "pt"
    panel_label:
      size: 9.0
      weight: "bold"
    axis_title:
      size: 9.0
      weight: "regular"
    tick_label:
      size: 9.0
      weight: "regular"
    legend_title:
      size: 9.0
      weight: "bold"
    legend_text:
      size: 9.0
      weight: "regular"
    annotation:
      size: 9.0
      weight: "regular"
    min_allowed_size: 6.0  # IEEE production rejection floor

# ------------------------------------------------------------------------------
# Line Weights & Stroke Thickness
# Source: IEEE Guidelines - "Do not use line weights lighter than 0.5 point (0.18 mm)."
# ------------------------------------------------------------------------------
line_weights:
  unit: "pt"
  axis_lines: 0.5
  tick_marks: 0.5
  data_lines_normal: 1.0
  data_lines_thick: 1.5
  grid_lines: 0.5
  min_allowed_weight: 0.5  # Strict IEEE production floor

# ------------------------------------------------------------------------------
# Panel Labeling Convention
# Source: IEEE Style Guide - "(a) Sub-figure caption. (b) Sub-figure caption."
# ------------------------------------------------------------------------------
panel_labeling:
  case: "lowercase"
  weight: "bold"
  punctuation: "(a)"
  position: "top_left"
  font_family: "Times New Roman"

# ------------------------------------------------------------------------------
# Color & Accessibility Requirements
# Source: IEEE - "Figures must be clearly interpretable in grayscale or by color-blind readers."
# ------------------------------------------------------------------------------
color_specifications:
  accepted_modes:
    initial_submission:
      - "RGB"
    final_production:
      - "RGB"
      - "CMYK"
  color_blind_safe_required: true
  recommended_palettes:
    - "Okabe-Ito"
    - "Tol-Bright"
    - "Viridis"
  black_white_contrast_ratio: 4.5

# ------------------------------------------------------------------------------
# Export Formats & Resolution (DPI)
# Source: IEEE Graphics Checker - EPS and PDF preferred; TIFF for raster.
# ------------------------------------------------------------------------------
export_requirements:
  preferred_vector_formats:
    - format: "EPS"
      notes: "Encapsulated PostScript with fonts embedded or converted to curves."
    - format: "PDF"
      notes: "Vector PDF with high-resolution subset fonts embedded."
  accepted_raster_formats:
    - format: "TIFF"
      compression: "LZW"
  resolution_dpi:
    line_art: 1000
    combination_art: 600
    photographic_halftone: 300
  max_file_size_mb: 50

# ------------------------------------------------------------------------------
# Manuscript Text Formatting
# Source: IEEE Article Templates (IEEEtran) - Two-column US Letter format
# ------------------------------------------------------------------------------
manuscript_layout:
  page:
    size: "Letter"
    margins_mm:
      top: 19.1     # 0.75 in
      bottom: 25.4  # 1.0 in
      left: 16.5    # 0.65 in
      right: 16.5   # 0.65 in
  spacing:
    line_spacing: "single"
    line_numbering: "none"
  body_typography:
    font_family: "Times New Roman"
    font_size_pt: 10.0
  heading_hierarchy:
    title:
      size_pt: 24.0
      weight: "bold"
      numbered: false
    h1:
      size_pt: 10.0
      weight: "bold"
      numbered: true
    h2:
      size_pt: 10.0
      weight: "italic"
      numbered: true
    h3:
      size_pt: 10.0
      weight: "italic"
      numbered: true
  limits:
    abstract_max_words: 250
    main_text_max_words: 9000
    max_display_items: 12
  required_sections:
    - "Title, Authors, Affiliations"
    - "Abstract"
    - "Index Terms (Keywords)"
    - "Introduction"
    - "Related Work / System Model"
    - "Methodology / Proposed Formulation"
    - "Experimental Evaluation / Results"
    - "Conclusion"
    - "Acknowledgment"
    - "References"
    - "Biographies with Author Photographs"

# ------------------------------------------------------------------------------
# AI & Generative Technologies Policy
# Source: IEEE Principles for AI-Generated Text & Media
# "The use of artificial intelligence (AI)–generated text in an article shall not be
# listed as an author. The use of generative AI tools must be disclosed in the Acknowledgment."
# ------------------------------------------------------------------------------
ai_policy:
  authorship_eligible: false
  generative_imagery_allowed: false
  generative_imagery_exceptions: >
    Permissible only when generative AI models are the direct subject of scientific analysis.
  text_and_code_disclosure_required: true
  preferred_disclosure_placement: "Acknowledgment"
  policy_url: "https://journals.ieeeauthorcenter.ieee.org/become-an-ieee-journal-author/publishing-ethics/guidelines-and-policies/ieee-principles-for-artificial-intelligence-ai-generated-text/"
  official_statement_template: >
    The author(s) acknowledge the use of [TOOL NAME, VERSION, e.g., ChatGPT-4 / Claude 3.5]
    to assist in [SPECIFY PURPOSE: e.g., editing and improving English prose clarity / formatting references].
    The author(s) have reviewed all content and take full responsibility for the accuracy,
    originality, and integrity of the entire manuscript.

# ------------------------------------------------------------------------------
# Naming conventions: requirements, project recommendations, and unverified guidance
# Each rule carries its own evidence status; examples are illustrative.
# ------------------------------------------------------------------------------
naming_conventions:
  figures:
  - id: figure_numbering
    guidance: Number main figures independently of tables, starting at 1 in first-citation order.
    status: publisher_requirement
    source_url: https://journals.ieeeauthorcenter.ieee.org/wp-content/uploads/sites/7/IEEE-Editorial-Style-Manual-for-Authors.pdf
    source_section: Text Citation of Figures and Tables, p. 14
    verified_on: '2026-10-18'
    pattern: Fig. {number}
    numbering:
      style: arabic
      start: 1
      order: first_citation
      sequence: main_figures
    examples:
    - Fig. 1
    - Fig. 2
    - Fig. 3
  - id: figure_references
    guidance: Use the same figure identifier in text and captions; use a range only for consecutive figures.
      These grouped examples are project recommendations.
    status: project_recommendation
    examples:
    - Fig. 1
    - Figs. 1 and 3
    - Figs. 1–3
  - id: panel_references
    guidance: Use panel_labeling for letter case and punctuation. Panels share their parent figure number;
      these reference examples follow the existing panel labels.
    status: project_recommendation
    examples:
    - Fig. 1(a)
    - Fig. 1(a) and 1(c)
    - Fig. 1(a)–(c)
  captions:
  - id: caption_heading
    guidance: Start with Fig., the number, a period, and an em space before the caption text.
    status: publisher_requirement
    source_url: https://journals.ieeeauthorcenter.ieee.org/wp-content/uploads/sites/7/IEEE-Editorial-Style-Manual-for-Authors.pdf
    source_section: Text Citation of Figures and Tables, p. 14
    verified_on: '2026-10-18'
    pattern: Fig. {number}. {title}
    examples:
    - Fig. 1. Study design.
    - Fig. 2. Measured response.
    - Fig. 3. Validation results.
  - id: caption_panels
    guidance: Describe all panels in label order under one figure caption. Reuse the exact panel letters;
      do not number captions separately.
    status: project_recommendation
    examples:
    - Fig. 1. Study design. (a) Recruitment. (b) Sampling. (c) Analysis.
  - id: caption_placement
    guidance: Confirm whether captions belong beside figures, at the end of the manuscript, or in a separate
      document for the submission stage.
    status: unverified
    source_url: https://journals.ieeeauthorcenter.ieee.org/create-your-ieee-journal-article/create-graphics-for-your-article/
    examples:
    - Keep captions in figure-number order wherever the journal requests them.
  tables:
  - id: table_numbering
    guidance: Number tables in first-citation order independently of figures. Use Roman numerals for IEEE
      table headings.
    status: publisher_requirement
    source_url: https://journals.ieeeauthorcenter.ieee.org/wp-content/uploads/sites/7/IEEE-Editorial-Style-Manual-for-Authors.pdf
    source_section: Text Citation of Figures and Tables, pp. 14–15
    verified_on: '2026-10-18'
    pattern: TABLE {number}
    numbering:
      style: roman_upper
      start: 1
      order: first_citation
      sequence: main_tables
    examples:
    - TABLE I
    - TABLE II
    - TABLE III
  - id: table_title
    guidance: Center TABLE and its Roman numeral above the table; place the title on the next line without
      a final period.
    status: publisher_requirement
    source_url: https://journals.ieeeauthorcenter.ieee.org/wp-content/uploads/sites/7/IEEE-Editorial-Style-Manual-for-Authors.pdf
    source_section: Text Citation of Figures and Tables, p. 15
    verified_on: '2026-10-18'
    pattern: 'TABLE {number}

      {title}'
    examples:
    - 'TABLE I

      PARTICIPANT CHARACTERISTICS'
    - 'TABLE II

      MODEL PARAMETERS'
    - 'TABLE III

      VALIDATION METRICS'
  - id: table_references
    guidance: Use the table sequence in text references. These grouped and range examples are project
      recommendations.
    status: project_recommendation
    examples:
    - Table I
    - Tables I and III
    - Tables I–III
  supplementary:
  - id: supplementary_figure_numbering
    guidance: Use a separate sequence for this supplementary item type. These labels are provisional;
      confirm the journal’s current supporting-information or appendix convention.
    status: unverified
    source_url: https://journals.ieeeauthorcenter.ieee.org/create-your-ieee-journal-article/create-graphics-for-your-article/
    pattern: Supplementary Figure {number}
    numbering:
      style: arabic
      start: 1
      order: first_citation
      sequence: supplementary_figures
    examples:
    - Supplementary Figure 1
    - Supplementary Figure 2
    - Supplementary Figure 3
  - id: supplementary_table_numbering
    guidance: Use a separate sequence for this supplementary item type. These labels are provisional;
      confirm the journal’s current supporting-information or appendix convention.
    status: unverified
    source_url: https://journals.ieeeauthorcenter.ieee.org/create-your-ieee-journal-article/create-graphics-for-your-article/
    pattern: Supplementary Table {number}
    numbering:
      style: arabic
      start: 1
      order: first_citation
      sequence: supplementary_tables
    examples:
    - Supplementary Table 1
    - Supplementary Table 2
    - Supplementary Table 3
  - id: supplementary_captions
    guidance: Match supplementary captions and table titles to their supplementary identifiers, keeping
      them separate from main-item sequences.
    status: project_recommendation
    examples:
    - Supplementary Figure 1. Additional measurements.
    - Supplementary Table 1. Additional model parameters.
  filenames:
  - id: figure_filenames
    guidance: Use the first five letters of the primary author's surname (Gonzalez is shown here), followed by the item number. Tables insert .t before the number. Replace {ext} with an accepted format.
    status: publisher_requirement
    source_url: https://journals.ieeeauthorcenter.ieee.org/create-your-ieee-journal-article/create-graphics-for-your-article/file-formatting/
    source_section: File Naming Conventions
    verified_on: '2026-10-18'
    pattern: "{author5}{number}.{ext}"
    examples:
    - gonza1.{ext}
    - gonza2.{ext}
    - gonza3.{ext}
  - id: table_filenames
    guidance: Use the first five letters of the primary author's surname (Gonzalez is shown here), followed by the item number. Tables insert .t before the number. Replace {ext} with an accepted format.
    status: publisher_requirement
    source_url: https://journals.ieeeauthorcenter.ieee.org/create-your-ieee-journal-article/create-graphics-for-your-article/file-formatting/
    source_section: File Naming Conventions
    verified_on: '2026-10-18'
    pattern: "{author5}.t{number}.{ext}"
    examples:
    - gonza.t1.{ext}
    - gonza.t2.{ext}
    - gonza.t3.{ext}
  - id: caption_filenames
    guidance: If caption documents are requested, use one combined document or matching figure stems for
      individual documents. DOCX examples apply only when the journal accepts DOCX.
    status: project_recommendation
    examples:
    - figure_captions.docx
    - gonza1_caption.docx
    - gonza2_caption.docx
    - gonza3_caption.docx
  - id: supplementary_filenames
    guidance: Prefix separate supplementary files to prevent collisions with main items. Use an accepted
      extension; keep the same numeric identifier as the supplementary label.
    status: project_recommendation
    examples:
    - supplementary_figure_01.{ext}
    - supplementary_figure_02.{ext}
    - supplementary_table_01.{ext}
    - supplementary_figure_01_caption.docx
  - id: filename_priority
    guidance: Publisher and submission-portal instructions override project filenames. The surname example Gonzalez gives gonza1 for Fig. 1 and gonza.t1 for TABLE I.
    status: project_recommendation
    examples:
    - figure_10.{ext}
    - figure_100.{ext}
