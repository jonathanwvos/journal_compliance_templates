# ==============================================================================
# Science (AAAS): Journal Compliance Template
# Official Science guidelines: https://www.science.org/content/page/science-information-authors
# ==============================================================================

schema_version: "1.1.0"

metadata:
  publisher: "American Association for the Advancement of Science (AAAS)"
  journal_name: "Science"
  issn: "1095-9203"
  guidelines_url: "https://www.science.org/content/page/science-information-authors"
  last_verified: "2026-09-11"
  notes: >
    Official guidelines for Science Research Articles and Reports.
    Features 55 mm single-column width (2.17 in), uppercase bold panel labels ('A', 'B'),
    Helvetica typography, strict 4 display item cap, and prohibition of generative imagery.

# ------------------------------------------------------------------------------
# Figure Dimensions & Geometry
# Source: Science Instructions for Preparing Figures
# "Widths: 55 mm (1 column / 2.17 in), 120 mm (1.5 column / 4.72 in),
# 175 mm (2 column / 6.89 in / full page spread)."
# "Maximum depth: 230 mm."
# ------------------------------------------------------------------------------
figure_geometry:
  default_unit: "mm"
  max_height: 230.0
  column_widths:
    single_column:
      width: 55.0
      description: "Standard 1-column width (55 mm / 2.17 in)"
    one_and_half_column:
      width: 120.0
      description: "Intermediate 1.5-column width (120 mm / 4.72 in)"
    double_column:
      width: 175.0
      description: "Full text-width 2-column page spread (175 mm / 6.89 in)"
  panel_spacing:
    minimum_gutter: 3.0

# ------------------------------------------------------------------------------
# Typography Hierarchy for Figures
# Source: Science Artwork Guidelines - Helvetica preferred
# "Lettering should be 6–9 pt; panel labels 9 pt bold. Avoid fonts < 5.5 pt."
# ------------------------------------------------------------------------------
figure_typography:
  family_preferences:
    primary: "Helvetica"
    fallback:
      - "Arial"
    serif_alternative: "Times New Roman"
    symbol_font: "Symbol"
  font_sizes:
    unit: "pt"
    panel_label:
      size: 9.0
      weight: "bold"
    axis_title:
      size: 7.5
      weight: "regular"
    tick_label:
      size: 6.5
      weight: "regular"
    legend_title:
      size: 7.0
      weight: "bold"
    legend_text:
      size: 6.5
      weight: "regular"
    annotation:
      size: 6.0
      weight: "regular"
    min_allowed_size: 5.5  # Science production floor

# ------------------------------------------------------------------------------
# Line Weights & Stroke Thickness
# Source: Science Guidelines - Lines must not be thinner than 0.25 pt
# ------------------------------------------------------------------------------
line_weights:
  unit: "pt"
  axis_lines: 0.5
  tick_marks: 0.5
  data_lines_normal: 1.0
  data_lines_thick: 1.5
  grid_lines: 0.25
  min_allowed_weight: 0.25

# ------------------------------------------------------------------------------
# Panel Labeling Convention
# Source: Science Style Guide - "Panels must be labeled with capital letters (A, B, C)."
# ------------------------------------------------------------------------------
panel_labeling:
  case: "uppercase"
  weight: "bold"
  punctuation: ""
  position: "top_left_outside"
  font_family: "Helvetica"

# ------------------------------------------------------------------------------
# Color & Accessibility Requirements
# Source: Science Guidelines - Color-blind safe palettes required
# ------------------------------------------------------------------------------
color_specifications:
  accepted_modes:
    initial_submission:
      - "RGB"
    final_production:
      - "RGB"
      - "CMYK"
  color_blind_safe_required: true
  recommended_palettes:
    - "Okabe-Ito"
    - "Viridis"
    - "Tol-Bright"
  black_white_contrast_ratio: 4.5

# ------------------------------------------------------------------------------
# Export Formats & Resolution (DPI)
# ------------------------------------------------------------------------------
export_requirements:
  preferred_vector_formats:
    - format: "PDF"
      notes: "Vector PDF with subset fonts embedded."
    - format: "EPS"
      notes: "Encapsulated PostScript with fonts outlined."
    - format: "SVG"
      notes: "Clean vector SVG."
  accepted_raster_formats:
    - format: "TIFF"
      compression: "LZW"
  resolution_dpi:
    line_art: 1000
    combination_art: 600
    photographic_halftone: 300
  max_file_size_mb: 50

# ------------------------------------------------------------------------------
# Manuscript Text Formatting
# Source: Science Submission Guidelines - Double spaced, line numbered
# ------------------------------------------------------------------------------
manuscript_layout:
  page:
    size: "Letter"
    margins_mm:
      top: 25.4
      bottom: 25.4
      left: 25.4
      right: 25.4
  spacing:
    line_spacing: "double"
    line_numbering: "continuous"
  body_typography:
    font_family: "Times New Roman"
    font_size_pt: 12.0
  heading_hierarchy:
    title:
      size_pt: 18.0
      weight: "bold"
      numbered: false
    h1:
      size_pt: 14.0
      weight: "bold"
      numbered: false
    h2:
      size_pt: 12.0
      weight: "bold"
      numbered: false
  limits:
    abstract_max_words: 125
    main_text_max_words: 4500
    max_display_items: 4  # Strict Science limit for research articles
  required_sections:
    - "Title, Authors, Affiliations"
    - "One-Sentence Summary (≤150 characters)"
    - "Abstract (≤125 words)"
    - "Main Text"
    - "References and Notes"
    - "Acknowledgments (Funding, Author contributions, Competing interests, Data and materials availability)"
    - "Supplementary Materials"

# ------------------------------------------------------------------------------
# AI & Generative Technologies Policy
# Source: Science Editorial Policies - Authorship and Generative AI
# "Artificial intelligence cannot be an author. AI generated images/figures are prohibited."
# ------------------------------------------------------------------------------
ai_policy:
  authorship_eligible: false
  generative_imagery_allowed: false
  generative_imagery_exceptions: >
    Permissible only when generative AI models are the direct topic of scientific investigation.
  text_and_code_disclosure_required: true
  preferred_disclosure_placement: "Acknowledgments"
  policy_url: "https://www.science.org/content/page/science-information-authors#editorial-policies"
  official_statement_template: >
    The author(s) used [TOOL NAME, VERSION] to assist with [SPECIFY PURPOSE: e.g., improving prose style
    and grammatical phrasing]. All scientific arguments, calculations, and interpretations were
    generated and independently verified by the human authors, who accept full responsibility
    for the veracity and originality of the work.

# ------------------------------------------------------------------------------
# Naming conventions: requirements, project recommendations, and unverified guidance
# Each rule carries its own evidence status; examples are illustrative.
# ------------------------------------------------------------------------------
naming_conventions:
  figures:
  - id: figure_numbering
    guidance: Number main figures independently of tables, starting at 1 in first-citation order.
    status: unverified
    source_url: https://www.science.org/content/page/science-information-authors
    source_section: 'Figure numbering: confirm current journal instructions'
    pattern: Fig. {number}
    numbering:
      style: arabic
      start: 1
      order: first_citation
      sequence: main_figures
    examples:
    - Fig. 1
    - Fig. 2
    - Fig. 3
  - id: figure_references
    guidance: Provisional reference examples; confirm abbreviation, pluralization, and range style in
      current journal instructions.
    status: unverified
    examples:
    - Fig. 1
    - Figs. 1 and 3
    - Figs. 1–3
    source_url: https://www.science.org/content/page/science-information-authors
  - id: panel_references
    guidance: Use panel_labeling for letter case and punctuation. Panels share their parent figure number;
      these reference examples follow the existing panel labels.
    status: project_recommendation
    examples:
    - Fig. 1A
    - Fig. 1A and 1C
    - Fig. 1A–C
  captions:
  - id: caption_heading
    guidance: Match each caption to its figure number and begin with a concise title. Punctuation in these
      examples is a project convention unless separately verified.
    status: project_recommendation
    pattern: Fig. {number}. {title}
    examples:
    - Fig. 1. Study design.
    - Fig. 2. Measured response.
    - Fig. 3. Validation results.
  - id: caption_panels
    guidance: Describe all panels in label order under one figure caption. Reuse the exact panel letters;
      do not number captions separately.
    status: project_recommendation
    examples:
    - Fig. 1. Study design. A Recruitment. B Sampling. C Analysis.
  - id: caption_placement
    guidance: Confirm whether captions belong beside figures, at the end of the manuscript, or in a separate
      document for the submission stage.
    status: unverified
    source_url: https://www.science.org/content/page/science-information-authors
    examples:
    - Keep captions in figure-number order wherever the journal requests them.
  tables:
  - id: table_numbering
    guidance: Number tables independently of figures, starting at 1 in first-citation order.
    status: unverified
    source_url: https://www.science.org/content/page/science-information-authors
    source_section: 'Table numbering: confirm current journal instructions'
    pattern: Table {number}
    numbering:
      style: arabic
      start: 1
      order: first_citation
      sequence: main_tables
    examples:
    - Table 1
    - Table 2
    - Table 3
  - id: table_title
    guidance: Give each table a short descriptive title after its number; confirm placement for the submission
      stage.
    status: project_recommendation
    pattern: Table {number}. {title}
    examples:
    - Table 1. Participant characteristics.
    - Table 2. Model parameters.
    - Table 3. Validation metrics.
  - id: table_references
    guidance: Use the table sequence in text references. These grouped and range examples are project
      recommendations.
    status: project_recommendation
    examples:
    - Table 1
    - Tables 1 and 3
    - Tables 1–3
  supplementary:
  - id: supplementary_figure_numbering
    guidance: Use a separate sequence for this supplementary item type. These labels are provisional;
      confirm the journal’s current supporting-information or appendix convention.
    status: unverified
    source_url: https://www.science.org/content/page/science-information-authors
    pattern: fig. S{number}
    numbering:
      style: arabic
      start: 1
      order: first_citation
      sequence: supplementary_figures
    examples:
    - fig. S1
    - fig. S2
    - fig. S3
  - id: supplementary_table_numbering
    guidance: Use a separate sequence for this supplementary item type. These labels are provisional;
      confirm the journal’s current supporting-information or appendix convention.
    status: unverified
    source_url: https://www.science.org/content/page/science-information-authors
    pattern: table S{number}
    numbering:
      style: arabic
      start: 1
      order: first_citation
      sequence: supplementary_tables
    examples:
    - table S1
    - table S2
    - table S3
  - id: supplementary_captions
    guidance: Match supplementary captions and table titles to their supplementary identifiers, keeping
      them separate from main-item sequences.
    status: project_recommendation
    examples:
    - fig. S1. Additional measurements.
    - table S1. Additional model parameters.
  filenames:
  - id: figure_filenames
    guidance: Project filename recommendation for separate files only. Replace {ext} with an accepted
      format for this item and submission stage; this does not require a separate upload.
    status: project_recommendation
    pattern: figure_{number:02d}.{ext}
    examples:
    - figure_01.{ext}
    - figure_02.{ext}
    - figure_03.{ext}
  - id: table_filenames
    guidance: Project filename recommendation for separate files only. Replace {ext} with an accepted
      format for this item and submission stage; this does not require a separate upload.
    status: project_recommendation
    pattern: table_{number:02d}.{ext}
    examples:
    - table_01.{ext}
    - table_02.{ext}
    - table_03.{ext}
  - id: caption_filenames
    guidance: If caption documents are requested, use one combined document or matching figure stems for
      individual documents. DOCX examples apply only when the journal accepts DOCX.
    status: project_recommendation
    examples:
    - figure_captions.docx
    - figure_01_caption.docx
    - figure_02_caption.docx
    - figure_03_caption.docx
  - id: supplementary_filenames
    guidance: Prefix separate supplementary files to prevent collisions with main items. Use an accepted
      extension; keep the same numeric identifier as the supplementary label.
    status: project_recommendation
    examples:
    - supplementary_figure_01.{ext}
    - supplementary_figure_02.{ext}
    - supplementary_table_01.{ext}
    - supplementary_figure_01_caption.docx
  - id: filename_priority
    guidance: Publisher and submission-portal instructions override these project filenames. Zero-padding
      is at least two digits and does not truncate larger numbers.
    status: project_recommendation
    examples:
    - figure_10.{ext}
    - figure_100.{ext}
