# ==============================================================================
# ACS: Journal of the American Chemical Society (JACS) Compliance Template
# Official ACS guidelines: https://publish.acs.org/publish/author_guidelines?coden=jacsat
# ==============================================================================

schema_version: "1.1.0"

metadata:
  publisher: "American Chemical Society (ACS)"
  journal_name: "Journal of the American Chemical Society"
  issn: "0002-7863"
  guidelines_url: "https://publish.acs.org/publish/author_guidelines?coden=jacsat"
  last_verified: "2026-09-11"
  notes: >
    Official guidelines for JACS articles and communications.
    Specifies 3.25 in (82.5 mm) single-column width, mandatory TOC/Abstract graphic
    (3.25 x 1.75 in), uppercase panel identifiers ('A', 'B'), and 1200 DPI line art.

# ------------------------------------------------------------------------------
# Figure Dimensions & Geometry
# Source: ACS Artwork Guidelines - Sizing of Graphics
# "Single column width: 3.25 inches (82.5 mm / 20 picas)."
# "Double column width: 7.00 inches (177.8 mm / 42 picas)."
# "Maximum depth / height: 9.25 inches (235.0 mm / 55.5 picas)."
# ------------------------------------------------------------------------------
figure_geometry:
  default_unit: "mm"
  max_height: 235.0
  column_widths:
    single_column:
      width: 82.5
      description: "Standard single column width (3.25 in / 82.5 mm / 20 picas)"
    one_and_half_column:
      width: 114.0
      description: "Intermediate 1.5-column width (4.5 in / 114.0 mm / 27 picas)"
    double_column:
      width: 177.8
      description: "Full double column width (7.0 in / 177.8 mm / 42 picas)"
  panel_spacing:
    minimum_gutter: 3.0

# ------------------------------------------------------------------------------
# Typography Hierarchy for Figures
# Source: ACS Artwork Guidelines - "Arial or Helvetica preferred for lettering."
# "Lettering should be 6-10 pt. Text smaller than 6 pt will be illegible when reproduced."
# ------------------------------------------------------------------------------
figure_typography:
  family_preferences:
    primary: "Arial"
    fallback:
      - "Helvetica"
      - "Times New Roman"
    serif_alternative: "Times New Roman"
    symbol_font: "Symbol"
  font_sizes:
    unit: "pt"
    panel_label:
      size: 9.0
      weight: "bold"
    axis_title:
      size: 8.0
      weight: "regular"
    tick_label:
      size: 7.0
      weight: "regular"
    legend_title:
      size: 7.5
      weight: "bold"
    legend_text:
      size: 7.0
      weight: "regular"
    annotation:
      size: 6.5
      weight: "regular"
    min_allowed_size: 6.0  # ACS rejection threshold

# ------------------------------------------------------------------------------
# Line Weights & Stroke Thickness
# Source: ACS Guidelines - "Line weights must be no thinner than 0.5 pt (0.75 pt for chemical bonds)."
# ------------------------------------------------------------------------------
line_weights:
  unit: "pt"
  axis_lines: 0.5
  tick_marks: 0.5
  data_lines_normal: 1.0
  data_lines_thick: 1.5
  grid_lines: 0.25
  min_allowed_weight: 0.5

# ------------------------------------------------------------------------------
# Panel Labeling Convention
# Source: ACS Style Guide - "Identify multipart figures with uppercase bold letters (A, B, C)."
# ------------------------------------------------------------------------------
panel_labeling:
  case: "uppercase"
  weight: "bold"
  punctuation: ""
  position: "top_left"
  font_family: "Arial"

# ------------------------------------------------------------------------------
# Color & Accessibility Requirements
# Source: ACS Guidelines on Color & Contrast
# ------------------------------------------------------------------------------
color_specifications:
  accepted_modes:
    initial_submission:
      - "RGB"
    final_production:
      - "RGB"
      - "CMYK"
  color_blind_safe_required: true
  recommended_palettes:
    - "Okabe-Ito"
    - "Viridis"
    - "Tol-Bright"
  black_white_contrast_ratio: 4.5

# ------------------------------------------------------------------------------
# Export Formats & Resolution (DPI)
# Source: ACS Guidelines - 1200 DPI for line art / ChemDraw structures
# ------------------------------------------------------------------------------
export_requirements:
  preferred_vector_formats:
    - format: "PDF"
      notes: "High-resolution vector PDF with subset fonts embedded."
    - format: "EPS"
      notes: "Encapsulated PostScript with fonts converted to outlines/curves."
  accepted_raster_formats:
    - format: "TIFF"
      compression: "LZW"
  resolution_dpi:
    line_art: 1200             # Strict ACS standard for chemical structures & line art
    combination_art: 600
    photographic_halftone: 300
  max_file_size_mb: 50

# ------------------------------------------------------------------------------
# Manuscript Text Formatting
# Source: ACS Author Guidelines - Double spaced, line numbered manuscript
# ------------------------------------------------------------------------------
manuscript_layout:
  page:
    size: "Letter"
    margins_mm:
      top: 25.4
      bottom: 25.4
      left: 25.4
      right: 25.4
  spacing:
    line_spacing: "double"
    line_numbering: "continuous"
  body_typography:
    font_family: "Times New Roman"
    font_size_pt: 12.0
  heading_hierarchy:
    title:
      size_pt: 18.0
      weight: "bold"
      numbered: false
    h1:
      size_pt: 12.0
      weight: "bold"
      numbered: false
    h2:
      size_pt: 12.0
      weight: "italic"
      numbered: false
  limits:
    abstract_max_words: 250
    main_text_max_words: 8000
    max_display_items: 8
  required_sections:
    - "Title, Authors, Affiliations"
    - "Table of Contents (TOC) / Abstract Graphic (3.25 x 1.75 in)"
    - "Abstract"
    - "Introduction"
    - "Results and Discussion"
    - "Conclusions"
    - "Experimental Section / Methods"
    - "Associated Content (Supporting Information Notice)"
    - "Author Information"
    - "Acknowledgment"
    - "References"

# ------------------------------------------------------------------------------
# AI & Generative Technologies Policy
# Source: ACS Publishing Policies - Use of Generative AI and AI-Assisted Technologies
# ------------------------------------------------------------------------------
ai_policy:
  authorship_eligible: false
  generative_imagery_allowed: false
  generative_imagery_exceptions: >
    Permissible only when generative AI models are the direct subject of scientific analysis
    in chemical sciences or computational chemistry.
  text_and_code_disclosure_required: true
  preferred_disclosure_placement: "Acknowledgment"
  policy_url: "https://publish.acs.org/publish/author_guidelines?coden=jacsat#policies_ai"
  official_statement_template: >
    The author(s) declare that [TOOL NAME, VERSION, e.g., Claude 3.5 / ChatGPT] was used for
    [SPECIFY FUNCTION: e.g., language editing and drafting assistance]. The author(s) have
    reviewed, verified, and take full responsibility for all content and data reported in this manuscript.

# ------------------------------------------------------------------------------
# Naming conventions: requirements, project recommendations, and unverified guidance
# Each rule carries its own evidence status; examples are illustrative.
# ------------------------------------------------------------------------------
naming_conventions:
  figures:
  - id: figure_numbering
    guidance: Number main figures independently of tables, starting at 1 in first-citation order.
    status: unverified
    source_url: https://publish.acs.org/publish/author_guidelines?coden=jacsat
    source_section: 'Figure numbering: confirm current journal instructions'
    pattern: Figure {number}
    numbering:
      style: arabic
      start: 1
      order: first_citation
      sequence: main_figures
    examples:
    - Figure 1
    - Figure 2
    - Figure 3
  - id: figure_references
    guidance: Provisional reference examples; confirm abbreviation, pluralization, and range style in
      current journal instructions.
    status: unverified
    examples:
    - Figure 1
    - Figures 1 and 3
    - Figures 1–3
    source_url: https://publish.acs.org/publish/author_guidelines?coden=jacsat
  - id: panel_references
    guidance: Use panel_labeling for letter case and punctuation. Panels share their parent figure number;
      these reference examples follow the existing panel labels.
    status: project_recommendation
    examples:
    - Figure 1A
    - Figure 1A and 1C
    - Figure 1A–C
  captions:
  - id: caption_heading
    guidance: Match each caption to its figure number and begin with a concise title. Punctuation in these
      examples is a project convention unless separately verified.
    status: project_recommendation
    pattern: Figure {number}. {title}
    examples:
    - Figure 1. Study design.
    - Figure 2. Measured response.
    - Figure 3. Validation results.
  - id: caption_panels
    guidance: Describe all panels in label order under one figure caption. Reuse the exact panel letters;
      do not number captions separately.
    status: project_recommendation
    examples:
    - Figure 1. Study design. A Recruitment. B Sampling. C Analysis.
  - id: caption_content
    guidance: Place a caption below each figure with its number and a brief description understandable
      on its own.
    status: publisher_requirement
    source_url: https://researcher-resources.acs.org/publish/author_guidelines/pdf?coden=jacsat
    source_section: 'Graphics: Figures (indexed official guideline excerpt)'
    verified_on: '2026-10-18'
    examples:
    - Figure 1. Reaction setup and measured response.
  tables:
  - id: table_numbering
    guidance: Number tables independently of figures, starting at 1 in first-citation order.
    status: unverified
    source_url: https://publish.acs.org/publish/author_guidelines?coden=jacsat
    source_section: 'Table numbering: confirm current journal instructions'
    pattern: Table {number}
    numbering:
      style: arabic
      start: 1
      order: first_citation
      sequence: main_tables
    examples:
    - Table 1
    - Table 2
    - Table 3
  - id: table_title
    guidance: Give each table a short descriptive title after its number; confirm placement for the submission
      stage.
    status: project_recommendation
    pattern: Table {number}. {title}
    examples:
    - Table 1. Participant characteristics.
    - Table 2. Model parameters.
    - Table 3. Validation metrics.
  - id: table_references
    guidance: Use the table sequence in text references. These grouped and range examples are project
      recommendations.
    status: project_recommendation
    examples:
    - Table 1
    - Tables 1 and 3
    - Tables 1–3
  supplementary:
  - id: supplementary_figure_numbering
    guidance: Use a separate sequence for this supplementary item type. These labels are provisional;
      confirm the journal’s current supporting-information or appendix convention.
    status: unverified
    source_url: https://publish.acs.org/publish/author_guidelines?coden=jacsat
    pattern: Figure S{number}
    numbering:
      style: arabic
      start: 1
      order: first_citation
      sequence: supplementary_figures
    examples:
    - Figure S1
    - Figure S2
    - Figure S3
  - id: supplementary_table_numbering
    guidance: Use a separate sequence for this supplementary item type. These labels are provisional;
      confirm the journal’s current supporting-information or appendix convention.
    status: unverified
    source_url: https://publish.acs.org/publish/author_guidelines?coden=jacsat
    pattern: Table S{number}
    numbering:
      style: arabic
      start: 1
      order: first_citation
      sequence: supplementary_tables
    examples:
    - Table S1
    - Table S2
    - Table S3
  - id: supplementary_captions
    guidance: Match supplementary captions and table titles to their supplementary identifiers, keeping
      them separate from main-item sequences.
    status: project_recommendation
    examples:
    - Figure S1. Additional measurements.
    - Table S1. Additional model parameters.
  filenames:
  - id: figure_filenames
    guidance: Project filename recommendation for separate files only. Replace {ext} with an accepted
      format for this item and submission stage; this does not require a separate upload.
    status: project_recommendation
    pattern: figure_{number:02d}.{ext}
    examples:
    - figure_01.{ext}
    - figure_02.{ext}
    - figure_03.{ext}
  - id: table_filenames
    guidance: Project filename recommendation for separate files only. Replace {ext} with an accepted
      format for this item and submission stage; this does not require a separate upload.
    status: project_recommendation
    pattern: table_{number:02d}.{ext}
    examples:
    - table_01.{ext}
    - table_02.{ext}
    - table_03.{ext}
  - id: caption_filenames
    guidance: If caption documents are requested, use one combined document or matching figure stems for
      individual documents. DOCX examples apply only when the journal accepts DOCX.
    status: project_recommendation
    examples:
    - figure_captions.docx
    - figure_01_caption.docx
    - figure_02_caption.docx
    - figure_03_caption.docx
  - id: supplementary_filenames
    guidance: Prefix separate supplementary files to prevent collisions with main items. Use an accepted
      extension; keep the same numeric identifier as the supplementary label.
    status: project_recommendation
    examples:
    - supplementary_figure_01.{ext}
    - supplementary_figure_02.{ext}
    - supplementary_table_01.{ext}
    - supplementary_figure_01_caption.docx
  - id: filename_priority
    guidance: Publisher and submission-portal instructions override these project filenames. Zero-padding
      is at least two digits and does not truncate larger numbers.
    status: project_recommendation
    examples:
    - figure_10.{ext}
    - figure_100.{ext}
