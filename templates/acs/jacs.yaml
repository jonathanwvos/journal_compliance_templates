# ==============================================================================
# ACS: Journal of the American Chemical Society (JACS) Compliance Template
# Official ACS guidelines: https://publish.acs.org/publish/author_guidelines?coden=jacsat
# ==============================================================================

schema_version: "1.0.0"

metadata:
  publisher: "American Chemical Society (ACS)"
  journal_name: "Journal of the American Chemical Society"
  issn: "0002-7863"
  guidelines_url: "https://publish.acs.org/publish/author_guidelines?coden=jacsat"
  last_verified: "2026-09-11"
  notes: >
    Official guidelines for JACS articles and communications.
    Specifies 3.25 in (82.5 mm) single-column width, mandatory TOC/Abstract graphic
    (3.25 x 1.75 in), uppercase panel identifiers ('A', 'B'), and 1200 DPI line art.

# ------------------------------------------------------------------------------
# Figure Dimensions & Geometry
# Source: ACS Artwork Guidelines - Sizing of Graphics
# "Single column width: 3.25 inches (82.5 mm / 20 picas)."
# "Double column width: 7.00 inches (177.8 mm / 42 picas)."
# "Maximum depth / height: 9.25 inches (235.0 mm / 55.5 picas)."
# ------------------------------------------------------------------------------
figure_geometry:
  default_unit: "mm"
  max_height: 235.0
  column_widths:
    single_column:
      width: 82.5
      description: "Standard single column width (3.25 in / 82.5 mm / 20 picas)"
    one_and_half_column:
      width: 114.0
      description: "Intermediate 1.5-column width (4.5 in / 114.0 mm / 27 picas)"
    double_column:
      width: 177.8
      description: "Full double column width (7.0 in / 177.8 mm / 42 picas)"
  panel_spacing:
    minimum_gutter: 3.0

# ------------------------------------------------------------------------------
# Typography Hierarchy for Figures
# Source: ACS Artwork Guidelines - "Arial or Helvetica preferred for lettering."
# "Lettering should be 6-10 pt. Text smaller than 6 pt will be illegible when reproduced."
# ------------------------------------------------------------------------------
figure_typography:
  family_preferences:
    primary: "Arial"
    fallback:
      - "Helvetica"
      - "Times New Roman"
    serif_alternative: "Times New Roman"
    symbol_font: "Symbol"
  font_sizes:
    unit: "pt"
    panel_label:
      size: 9.0
      weight: "bold"
    axis_title:
      size: 8.0
      weight: "regular"
    tick_label:
      size: 7.0
      weight: "regular"
    legend_title:
      size: 7.5
      weight: "bold"
    legend_text:
      size: 7.0
      weight: "regular"
    annotation:
      size: 6.5
      weight: "regular"
    min_allowed_size: 6.0  # ACS rejection threshold

# ------------------------------------------------------------------------------
# Line Weights & Stroke Thickness
# Source: ACS Guidelines - "Line weights must be no thinner than 0.5 pt (0.75 pt for chemical bonds)."
# ------------------------------------------------------------------------------
line_weights:
  unit: "pt"
  axis_lines: 0.5
  tick_marks: 0.5
  data_lines_normal: 1.0
  data_lines_thick: 1.5
  grid_lines: 0.25
  min_allowed_weight: 0.5

# ------------------------------------------------------------------------------
# Panel Labeling Convention
# Source: ACS Style Guide - "Identify multipart figures with uppercase bold letters (A, B, C)."
# ------------------------------------------------------------------------------
panel_labeling:
  case: "uppercase"
  weight: "bold"
  punctuation: ""
  position: "top_left"
  font_family: "Arial"

# ------------------------------------------------------------------------------
# Color & Accessibility Requirements
# Source: ACS Guidelines on Color & Contrast
# ------------------------------------------------------------------------------
color_specifications:
  accepted_modes:
    initial_submission:
      - "RGB"
    final_production:
      - "RGB"
      - "CMYK"
  color_blind_safe_required: true
  recommended_palettes:
    - "Okabe-Ito"
    - "Viridis"
    - "Tol-Bright"
  black_white_contrast_ratio: 4.5

# ------------------------------------------------------------------------------
# Export Formats & Resolution (DPI)
# Source: ACS Guidelines - 1200 DPI for line art / ChemDraw structures
# ------------------------------------------------------------------------------
export_requirements:
  preferred_vector_formats:
    - format: "PDF"
      notes: "High-resolution vector PDF with subset fonts embedded."
    - format: "EPS"
      notes: "Encapsulated PostScript with fonts converted to outlines/curves."
  accepted_raster_formats:
    - format: "TIFF"
      compression: "LZW"
  resolution_dpi:
    line_art: 1200             # Strict ACS standard for chemical structures & line art
    combination_art: 600
    photographic_halftone: 300
  max_file_size_mb: 50

# ------------------------------------------------------------------------------
# Manuscript Text Formatting
# Source: ACS Author Guidelines - Double spaced, line numbered manuscript
# ------------------------------------------------------------------------------
manuscript_layout:
  page:
    size: "Letter"
    margins_mm:
      top: 25.4
      bottom: 25.4
      left: 25.4
      right: 25.4
  spacing:
    line_spacing: "double"
    line_numbering: "continuous"
  body_typography:
    font_family: "Times New Roman"
    font_size_pt: 12.0
  heading_hierarchy:
    title:
      size_pt: 18.0
      weight: "bold"
      numbered: false
    h1:
      size_pt: 12.0
      weight: "bold"
      numbered: false
    h2:
      size_pt: 12.0
      weight: "italic"
      numbered: false
  limits:
    abstract_max_words: 250
    main_text_max_words: 8000
    max_display_items: 8
  required_sections:
    - "Title, Authors, Affiliations"
    - "Table of Contents (TOC) / Abstract Graphic (3.25 x 1.75 in)"
    - "Abstract"
    - "Introduction"
    - "Results and Discussion"
    - "Conclusions"
    - "Experimental Section / Methods"
    - "Associated Content (Supporting Information Notice)"
    - "Author Information"
    - "Acknowledgment"
    - "References"

# ------------------------------------------------------------------------------
# AI & Generative Technologies Policy
# Source: ACS Publishing Policies - Use of Generative AI and AI-Assisted Technologies
# ------------------------------------------------------------------------------
ai_policy:
  authorship_eligible: false
  generative_imagery_allowed: false
  generative_imagery_exceptions: >
    Permissible only when generative AI models are the direct subject of scientific analysis
    in chemical sciences or computational chemistry.
  text_and_code_disclosure_required: true
  preferred_disclosure_placement: "Acknowledgment"
  policy_url: "https://publish.acs.org/publish/author_guidelines?coden=jacsat#policies_ai"
  official_statement_template: >
    The author(s) declare that [TOOL NAME, VERSION, e.g., Claude 3.5 / ChatGPT] was used for
    [SPECIFY FUNCTION: e.g., language editing and drafting assistance]. The author(s) have
    reviewed, verified, and take full responsibility for all content and data reported in this manuscript.
