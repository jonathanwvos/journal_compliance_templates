# ==============================================================================
# Nature Portfolio: Journal Compliance Template
# Official Nature guidelines: https://www.nature.com/nature/for-authors/final-submission
# ==============================================================================

schema_version: "1.1.0"

metadata:
  publisher: "Nature Portfolio (Springer Nature)"
  journal_name: "Nature"
  issn: "1476-4687"
  guidelines_url: "https://www.nature.com/nature/for-authors/final-submission"
  last_verified: "2026-09-11"
  notes: >
    Official guidelines for primary research articles and brief communications.
    Specific attention must be paid to font embedding, 89 mm single-column width,
    lowercase bold panel letters ('a', 'b'), and minimum 5 pt font size.

# ------------------------------------------------------------------------------
# Figure Dimensions & Geometry
# Source: Nature Final Submission Guide - "Figure sizing"
# "Figures should be sized to fit Nature's column widths of 89 mm (single column),
# 120 mm (1.5 column) or 180 mm (double column / full text spread)."
# ------------------------------------------------------------------------------
figure_geometry:
  default_unit: "mm"
  max_height: 170.0  # Conservative cap shared with Extended Data; research-figure-guide.nature.com/figures/extended-data-formatting-guidelines/
  column_widths:
    single_column:
      width: 89.0
      description: "Standard single column width (89 mm / 3.5 in)"
    one_and_half_column:
      width: 120.0
      description: "Intermediate 1.5-column width (120 mm / 4.7 in)"
    double_column:
      width: 180.0
      description: "Full text-width page spread (180 mm / 7.1 in)"
  panel_spacing:
    minimum_gutter: 3.0 # Minimum recommended gutter between adjacent panels

# ------------------------------------------------------------------------------
# Typography Hierarchy for Figures
# Source: Nature Guide - "Lettering should be in Helvetica or Arial."
# "At final printed size, letters must not be smaller than 5 pt (ideal range 6–8 pt)."
# ------------------------------------------------------------------------------
figure_typography:
  family_preferences:
    primary: "Helvetica"
    fallback:
      - "Arial"
    serif_alternative: "Times New Roman"
    symbol_font: "Symbol"
  font_sizes:
    unit: "pt"
    panel_label:
      size: 8.0
      weight: "bold"
    axis_title:
      size: 7.0
      weight: "regular"
    tick_label:
      size: 6.0
      weight: "regular"
    legend_title:
      size: 6.5
      weight: "bold"
    legend_text:
      size: 6.0
      weight: "regular"
    annotation:
      size: 5.5
      weight: "regular"
    min_allowed_size: 5.0 # Pre-flight rejection threshold

# ------------------------------------------------------------------------------
# Line Weights & Stroke Thickness
# Source: "Lines should be no thinner than 0.25 pt (0.5 pt preferred for visibility)."
# ------------------------------------------------------------------------------
line_weights:
  unit: "pt"
  axis_lines: 0.5
  tick_marks: 0.5
  data_lines_normal: 1.0
  data_lines_thick: 1.0  # Extended Data strokes must be at most 1 pt
  grid_lines: 0.25
  min_allowed_weight: 0.25

# ------------------------------------------------------------------------------
# Panel Labeling Convention
# Source: "Panels must be labelled with lowercase, bold letters (a, b, c, etc.)"
# "No brackets, parentheses, or trailing periods should be used."
# ------------------------------------------------------------------------------
panel_labeling:
  case: "lowercase"     # 'a', 'b', 'c'
  weight: "bold"
  punctuation: ""       # Pure letter: 'a', not '(a)' or 'a.'
  position: "top_left_outside"
  font_family: "Helvetica"

# ------------------------------------------------------------------------------
# Color & Accessibility Requirements
# Source: Nature Accessibility Guidelines - "Figures must be readable by individuals
# with color-vision deficiencies (e.g. avoid red/green simultaneous contrasts)."
# ------------------------------------------------------------------------------
color_specifications:
  accepted_modes:
    initial_submission:
      - "RGB"
    final_production:
      - "RGB"
      - "CMYK"
  color_blind_safe_required: true
  recommended_palettes:
    - "Okabe-Ito"
    - "Viridis"
    - "ColorBrewer-Set2"
  black_white_contrast_ratio: 4.5

# ------------------------------------------------------------------------------
# Export Formats & Resolution (DPI)
# Source: Nature Artwork Guidelines - Vector (PDF/EPS) preferred; TIFF for rasters.
# ------------------------------------------------------------------------------
export_requirements:
  preferred_vector_formats:
    - format: "PDF"
      notes: "Vector PDF with all fonts embedded or outlined."
    - format: "EPS"
      notes: "Encapsulated PostScript with fonts converted to outlines/curves."
  accepted_raster_formats:
    - format: "TIFF"
      compression: "LZW"
  resolution_dpi:
    line_art: 1000            # Pure monochrome / vector graphs rasterized
    combination_art: 600       # Photographic image with vector text/overlays
    photographic_halftone: 300 # Micrographs, photos
  max_file_size_mb: 50

# ------------------------------------------------------------------------------
# Manuscript Text Formatting
# Source: Nature Submission Guidelines - Double-spaced text, continuous line numbers
# ------------------------------------------------------------------------------
manuscript_layout:
  page:
    size: "A4"
    margins_mm:
      top: 25.4
      bottom: 25.4
      left: 25.4
      right: 25.4
  spacing:
    line_spacing: "double"
    line_numbering: "continuous"
  body_typography:
    font_family: "Times New Roman"
    font_size_pt: 12.0
  heading_hierarchy:
    title:
      size_pt: 18.0
      weight: "bold"
      numbered: false
    h1:
      size_pt: 14.0
      weight: "bold"
      numbered: false
    h2:
      size_pt: 12.0
      weight: "bold"
      numbered: false
    h3:
      size_pt: 12.0
      weight: "italic"
      numbered: false
  limits:
    abstract_max_words: 150
    main_text_max_words: 5000
    max_display_items: 6 # Combined figure + table limit for standard articles
  required_sections:
    - "Title, Authors, Affiliations"
    - "Abstract"
    - "Main Text (Introduction, Results, Discussion)"
    - "Methods"
    - "Data Availability"
    - "Code Availability"
    - "References"
    - "Acknowledgements"
    - "Author Contributions"
    - "Ethics Declarations / Competing Interests"

# ------------------------------------------------------------------------------
# AI & Generative Technologies Policy
# Source: Nature Portfolio Editorial Policies - Artificial Intelligence (AI)
# "Large Language Models (LLMs) do not satisfy authorship criteria.
# Generative AI images/art are not permitted for scientific publication."
# ------------------------------------------------------------------------------
ai_policy:
  authorship_eligible: false
  generative_imagery_allowed: false
  generative_imagery_exceptions: >
    Permissible only when the manuscript specifically investigates generative AI models
    as the primary subject of scientific inquiry.
  text_and_code_disclosure_required: true
  preferred_disclosure_placement: "Methods"
  policy_url: "https://www.nature.com/nature-portfolio/editorial-policies/ai"
  official_statement_template: >
    During the preparation of this manuscript, the author(s) used [TOOL NAME, VERSION, e.g., Claude 3.5 Sonnet / ChatGPT]
    in order to [SPECIFY PURPOSE: e.g., refine prose for readability / assist in drafting Python data processing routines].
    The author(s) reviewed and edited the output as needed and take full responsibility for the integrity and accuracy
    of all published material.

# ------------------------------------------------------------------------------
# Naming conventions: requirements, project recommendations, and unverified guidance
# Each rule carries its own evidence status; examples are illustrative.
# ------------------------------------------------------------------------------
naming_conventions:
  figures:
  - id: figure_numbering
    guidance: Number main figures independently of tables, starting at 1 in first-citation order.
    status: unverified
    source_url: https://www.nature.com/nature/for-authors/final-submission
    source_section: 'Figure numbering: confirm current journal instructions'
    pattern: Fig. {number}
    numbering:
      style: arabic
      start: 1
      order: first_citation
      sequence: main_figures
    examples:
    - Fig. 1
    - Fig. 2
    - Fig. 3
  - id: figure_references
    guidance: Use the same figure identifier in text and captions; use a range only for consecutive figures.
      These grouped examples are project recommendations.
    status: project_recommendation
    examples:
    - Fig. 1
    - Figs. 1 and 3
    - Figs. 1–3
  - id: panel_references
    guidance: Use panel_labeling for letter case and punctuation. Panels share their parent figure number;
      these reference examples follow the existing panel labels.
    status: project_recommendation
    examples:
    - Fig. 1a
    - Fig. 1a and 1c
    - Fig. 1a–c
  captions:
  - id: caption_heading
    guidance: Match each caption to its figure number and begin with a concise title. Punctuation in these
      examples is a project convention unless separately verified.
    status: project_recommendation
    pattern: Fig. {number}. {title}
    examples:
    - Fig. 1. Study design.
    - Fig. 2. Measured response.
    - Fig. 3. Validation results.
  - id: caption_panels
    guidance: Describe all panels in label order under one figure caption. Reuse the exact panel letters;
      do not number captions separately.
    status: project_recommendation
    examples:
    - Fig. 1. Study design. a Recruitment. b Sampling. c Analysis.
  - id: caption_content
    guidance: For initial submission, put the legend on the figure page. Start with a short title describing
      the whole figure, then explain its contents.
    status: publisher_requirement
    source_url: https://www.nature.com/nature/for-authors/initial-submission
    source_section: Figures and figure legends
    verified_on: '2026-10-18'
    examples:
    - Study design. Recruitment, sampling, and analysis are shown in panels a, b, and c.
  tables:
  - id: table_numbering
    guidance: Number tables independently of figures, starting at 1 in first-citation order.
    status: unverified
    source_url: https://www.nature.com/nature/for-authors/final-submission
    source_section: 'Table numbering: confirm current journal instructions'
    pattern: Table {number}
    numbering:
      style: arabic
      start: 1
      order: first_citation
      sequence: main_tables
    examples:
    - Table 1
    - Table 2
    - Table 3
  - id: table_title
    guidance: Give each table a short descriptive title after its number; confirm placement for the submission
      stage.
    status: project_recommendation
    pattern: Table {number}. {title}
    examples:
    - Table 1. Participant characteristics.
    - Table 2. Model parameters.
    - Table 3. Validation metrics.
  - id: table_references
    guidance: Use the table sequence in text references. These grouped and range examples are project
      recommendations.
    status: project_recommendation
    examples:
    - Table 1
    - Tables 1 and 3
    - Tables 1–3
  supplementary:
  - id: supplementary_figure_numbering
    guidance: Use a separate sequence for this supplementary item type. These labels are provisional;
      confirm the journal’s current supporting-information or appendix convention.
    status: unverified
    source_url: https://www.nature.com/nature/for-authors/final-submission
    pattern: Supplementary Figure {number}
    numbering:
      style: arabic
      start: 1
      order: first_citation
      sequence: supplementary_figures
    examples:
    - Supplementary Figure 1
    - Supplementary Figure 2
    - Supplementary Figure 3
  - id: supplementary_table_numbering
    guidance: Use a separate sequence for this supplementary item type. These labels are provisional;
      confirm the journal’s current supporting-information or appendix convention.
    status: unverified
    source_url: https://www.nature.com/nature/for-authors/final-submission
    pattern: Supplementary Table {number}
    numbering:
      style: arabic
      start: 1
      order: first_citation
      sequence: supplementary_tables
    examples:
    - Supplementary Table 1
    - Supplementary Table 2
    - Supplementary Table 3
  - id: supplementary_captions
    guidance: Match supplementary captions and table titles to their supplementary identifiers, keeping
      them separate from main-item sequences.
    status: project_recommendation
    examples:
    - Supplementary Figure 1. Additional measurements.
    - Supplementary Table 1. Additional model parameters.
  filenames:
  - id: figure_filenames
    guidance: Project filename recommendation for separate files only. Replace {ext} with an accepted
      format for this item and submission stage; this does not require a separate upload.
    status: project_recommendation
    pattern: figure_{number:02d}.{ext}
    examples:
    - figure_01.{ext}
    - figure_02.{ext}
    - figure_03.{ext}
  - id: table_filenames
    guidance: Project filename recommendation for separate files only. Replace {ext} with an accepted
      format for this item and submission stage; this does not require a separate upload.
    status: project_recommendation
    pattern: table_{number:02d}.{ext}
    examples:
    - table_01.{ext}
    - table_02.{ext}
    - table_03.{ext}
  - id: caption_filenames
    guidance: If caption documents are requested, use one combined document or matching figure stems for
      individual documents. DOCX examples apply only when the journal accepts DOCX.
    status: project_recommendation
    examples:
    - figure_captions.docx
    - figure_01_caption.docx
    - figure_02_caption.docx
    - figure_03_caption.docx
  - id: supplementary_filenames
    guidance: Prefix separate supplementary files to prevent collisions with main items. Use an accepted
      extension; keep the same numeric identifier as the supplementary label.
    status: project_recommendation
    examples:
    - supplementary_figure_01.{ext}
    - supplementary_figure_02.{ext}
    - supplementary_table_01.{ext}
    - supplementary_figure_01_caption.docx
  - id: filename_priority
    guidance: Publisher and submission-portal instructions override these project filenames. Zero-padding
      is at least two digits and does not truncate larger numbers.
    status: project_recommendation
    examples:
    - figure_10.{ext}
    - figure_100.{ext}
  - id: extended_data_filenames
    guidance: Prefix separate Extended Data files and match captions by item number. Confirm allowed formats
      and upload packaging with Nature.
    status: project_recommendation
    examples:
    - extended_data_figure_01.{ext}
    - extended_data_figure_02.{ext}
    - extended_data_table_01.{ext}
    - extended_data_figure_01_caption.docx
  extended_data:
  - id: extended_data_scope
    guidance: Nature prefers additional figures and small tables as Extended Data. Follow the final-submission
      formatting instructions if the article is accepted.
    status: publisher_requirement
    source_url: https://www.nature.com/nature/for-authors/initial-submission
    source_section: Extended data; Supplementary information
    verified_on: '2026-10-18'
    examples:
    - Use Extended Data for additional display items integral to the study.
  - id: extended_data_figure_numbering
    guidance: Keep this sequence separate from main and supplementary items. Confirm final label and citation
      styling with Nature.
    status: unverified
    source_url: https://www.nature.com/nature/for-authors/final-submission
    pattern: Extended Data Figure {number}
    numbering:
      style: arabic
      start: 1
      order: first_citation
      sequence: extended_data_figures
    examples:
    - Extended Data Figure 1
    - Extended Data Figure 2
    - Extended Data Figure 3
  - id: extended_data_table_numbering
    guidance: Keep this sequence separate from main and supplementary items. Confirm final label and citation
      styling with Nature.
    status: unverified
    source_url: https://www.nature.com/nature/for-authors/final-submission
    pattern: Extended Data Table {number}
    numbering:
      style: arabic
      start: 1
      order: first_citation
      sequence: extended_data_tables
    examples:
    - Extended Data Table 1
    - Extended Data Table 2
    - Extended Data Table 3
  - id: extended_data_captions
    guidance: Use the Extended Data item identifier in each caption or title.
    status: project_recommendation
    examples:
    - Extended Data Figure 1. Additional measurements.
    - Extended Data Table 1. Additional parameters.
